/* =========================================================================
   WEBGL
   ========================================================================= */
const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false });
const glOk = !!gl && !!gl.getExtension('EXT_color_buffer_float');

function showNotice(text) { noticeEl.textContent = text; noticeEl.style.display = 'block'; }

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function program(fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    loc[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { p, loc };
}

/** Imposta uniform per nome, deducendo il tipo dal valore. I nomi assenti (ottimizzati via) sono ignorati. */
function setU(prog, name, v) {
  const l = prog.loc[name];
  if (l == null) return;
  if (typeof v === 'number') gl.uniform1f(l, v);
  else if (v.length === 2) gl.uniform2f(l, v[0], v[1]);
  else if (v.length === 3) gl.uniform3f(l, v[0], v[1], v[2]);
}

function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

function freeTarget(t) {
  if (!t) return;
  gl.deleteTexture(t.tex);
  if (t.depthTex) gl.deleteTexture(t.depthTex);
  gl.deleteFramebuffer(t.fbo);
}

/** Target delle nubi: colore+trasmittanza (RGBA16F) e distanza (R16F), scritti insieme. */
function makeCloudTarget(w, h) {
  const t = makeTarget(w, h);
  const depthTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, depthTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, w, h, 0, gl.RED, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, depthTex, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer delle nubi incompleto');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  t.depthTex = depthTex;
  return t;
}

/* ----- Rumore 3D periodico: R = Perlin-Worley (forma), G = Worley fine (erosione) ----- */
function hashInt(x, y, z, s) {
  let h = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x9e3779b1) ^ Math.imul(s, 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

function buildNoise3D(N) {
  const data = new Uint8Array(N * N * N * 2);
  // Punti caratteristici di Worley per ogni frequenza
  const freqs = [4, 8, 16, 32];
  const pts = freqs.map((f, fi) => {
    const a = new Float32Array(f * f * f * 3);
    for (let z = 0; z < f; z++) for (let y = 0; y < f; y++) for (let x = 0; x < f; x++) {
      const i = ((z * f + y) * f + x) * 3;
      a[i] = hashInt(x, y, z, 11 + fi); a[i + 1] = hashInt(x, y, z, 23 + fi); a[i + 2] = hashInt(x, y, z, 37 + fi);
    }
    return a;
  });
  const worley = (u, v, w, fi) => {
    const f = freqs[fi], P = pts[fi];
    const X = u * f, Y = v * f, Z = w * f;
    const cx = Math.floor(X), cy = Math.floor(Y), cz = Math.floor(Z);
    let best = 9;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const gx = cx + dx, gy = cy + dy, gz = cz + dz;
      const wx = ((gx % f) + f) % f, wy = ((gy % f) + f) % f, wz = ((gz % f) + f) % f;
      const i = ((wz * f + wy) * f + wx) * 3;
      const ox = gx + P[i] - X, oy = gy + P[i + 1] - Y, oz = gz + P[i + 2] - Z;
      const d = ox * ox + oy * oy + oz * oz;
      if (d < best) best = d;
    }
    return 1 - clamp(Math.sqrt(best), 0, 1);       // invertito: "nuvoloso" dove vicino ai punti
  };
  const vnoise = (u, v, w, f, s) => {
    const X = u * f, Y = v * f, Z = w * f;
    const ix = Math.floor(X), iy = Math.floor(Y), iz = Math.floor(Z);
    let fx = X - ix, fy = Y - iy, fz = Z - iz;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
    const h = (a, b, c) => hashInt(((a % f) + f) % f, ((b % f) + f) % f, ((c % f) + f) % f, s);
    const l = (a, b, t) => a + (b - a) * t;
    return l(
      l(l(h(ix, iy, iz), h(ix + 1, iy, iz), fx), l(h(ix, iy + 1, iz), h(ix + 1, iy + 1, iz), fx), fy),
      l(l(h(ix, iy, iz + 1), h(ix + 1, iy, iz + 1), fx), l(h(ix, iy + 1, iz + 1), h(ix + 1, iy + 1, iz + 1), fx), fy), fz);
  };
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = (x + 0.5) / N, v = (y + 0.5) / N, w = (z + 0.5) / N;
    const w4 = worley(u, v, w, 0), w8 = worley(u, v, w, 1), w16 = worley(u, v, w, 2), w32 = worley(u, v, w, 3);
    const perlin = vnoise(u, v, w, 4, 1) * 0.5 + vnoise(u, v, w, 8, 2) * 0.25 + vnoise(u, v, w, 16, 3) * 0.125 + vnoise(u, v, w, 32, 4) * 0.0625;
    const pn = perlin / 0.9375;
    const wfbm = w4 * 0.625 + w8 * 0.25 + w16 * 0.125;
    const pw = clamp((pn - (wfbm - 1)) / (2 - wfbm), 0, 1);       // remap(perlin, -(1-worley), 1, 0, 1)
    const det = w8 * 0.625 + w16 * 0.25 + w32 * 0.125;
    const i = ((z * N + y) * N + x) * 2;
    data[i] = Math.round(pw * 255);
    data[i + 1] = Math.round(det * 255);
  }
  // Equalizzazione del canale forma: valori distribuiti uniformemente, così una soglia
  // di copertura c lascia nuvoloso circa la frazione c del volume
  const count = N * N * N, vals = new Float32Array(count);
  for (let k = 0; k < count; k++) vals[k] = data[k * 2] + hashInt(k, 5, 9, 77) * 0.99;   // rompe i pari merito
  const order = Array.from({ length: count }, (_, k) => k).sort((a, b) => vals[a] - vals[b]);
  for (let r = 0; r < count; r++) data[order[r] * 2] = Math.round(r / (count - 1) * 255);
  return data;
}

let progSky, progClouds, progComp, vao, noiseTex, skyLut;
/*
  Nubi a doppio buffer: "front" è quello mostrato; "back" viene ricalcolato a strisce,
  una per frame, con vento e camera fissati all'inizio del ricalcolo. Quando è completo
  i due si scambiano. Così nessun frame contiene il calcolo intero (niente scatti).
*/
const clouds = { front: null, back: null, frontWind: [0, 0], frontCam: null, job: null, lastStart: 0 };
const SKY_W = 192, SKY_H = 128, NOISE_N = 64;

function initGL() {
  progSky = program(FS_SKYLUT);
  progClouds = program(FS_CLOUDS);
  progComp = program(FS_COMPOSITE);
  vao = gl.createVertexArray();
  skyLut = makeTarget(SKY_W, SKY_H);
  noiseTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D, noiseTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.RG8, NOISE_N, NOISE_N, NOISE_N, 0, gl.RG, gl.UNSIGNED_BYTE, buildNoise3D(NOISE_N));
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, p, gl.REPEAT);
}

function draw(target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, target ? target.w : glCanvas.width, target ? target.h : glCanvas.height);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function bindTex(prog, name, unit, tex, target3d) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(target3d ? gl.TEXTURE_3D : gl.TEXTURE_2D, tex);
  if (prog.loc[name] != null) gl.uniform1i(prog.loc[name], unit);
}

/* =========================================================================
   CAMERA E PARAMETRI DI SCENA
   ========================================================================= */
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

function computeCamera(sunAzS, elev) {
  const portrait = H >= W;
  const tLong = Math.tan(CONFIG.maxFovDeg * DEG / 2);
  const tanY = portrait ? tLong : tLong * H / W;
  const tanX = portrait ? tLong * W / H : tLong;
  // Inquadratura tutta verso il cielo: anche il bordo inferiore resta sopra l'orizzonte.
  const pitch = Math.atan(tanY) / DEG + 0.8 + (wallpaperMode ? 0.7 * Math.sin(Date.now() / 210000) : 0);
  // Rotazione: di giorno verso il sole, di notte verso la finestra
  const rel = wrapDeg(sunAzS - CONFIG.facingAzimuth);
  const follow = CONFIG.followSun ? clamp(rel, -110, 110) * 0.85 * smooth(-10, -1, elev) : 0;
  const yaw = 180 + CONFIG.facingAzimuth + follow + userYaw;
  const fwd = dirFromAzEl(yaw, pitch);
  const right = norm(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  return { fwd, right, up, tanX, tanY, yaw, pixAngle: 2 * tanY / (H * dpr) };
}

/*
  Esposizione (EV, log2) in funzione dell'altezza del sole, misurata sul rendering in modo che la
  luminosità media dell'immagine (0–255) segua l'ora:
  sereno:  ≥10° ≈ 175 · 5° 160 · 0° 118 · −4° 68 · −6° 48 · −9° 30 · −12° 20 · notte 17
  coperto: 30° ≈ 144 · 10° 136 · 5° 115 · 0° 80 · −4° 45 · −6° 36 · −9° 30 · −12° 28 · notte 26
  Prima l'esposizione "apriva" di notte come una fotocamera e la notte risultava più chiara del crepuscolo.
*/
const EV_CLEAR = [[-90, 0.3], [-18, 0.3], [-15, 0.5], [-12, 0.7], [-9, 1.8], [-6, 4.05], [-4, 3.4],
  [-2, 1.15], [0, -0.01], [2, -0.25], [5, -0.43], [10, -0.6], [90, -0.6]];
const EV_OVERCAST = [[-90, -0.25], [-18, -0.25], [-15, -0.22], [-12, -0.2], [-9, -0.2], [-6, -0.01], [-4, 0.43],
  [-2, 0.2], [0, 0.33], [2, 0.16], [5, -0.06], [10, -0.4], [20, -0.98], [30, -1.35], [90, -1.35]];
function interpTable(t, x) {
  if (x <= t[0][0]) return t[0][1];
  for (let i = 0; i < t.length - 1; i++) {
    const [x0, y0] = t[i], [x1, y1] = t[i + 1];
    if (x <= x1) return mix(y0, y1, (x - x0) / (x1 - x0));
  }
  return t[t.length - 1][1];
}

function viewFor(date, w) {
  const s = solarPosition(date);
  const elev = s.alt;  const sunDir = dirFromAzEl(180 + s.az, s.apparentAlt);
  const oc = smooth(0.6, 1, w.cover);
  const haze = 1 + w.fog * 5 + w.rain * 6 + w.snow * 8 + oc * 1.5;
  const sunGround = transmittance(0.2, sunDir, haze).map(v => v * ATM.SUN);
  const cloudBase = mix(1.4, 0.9, oc), cloudTop = mix(4.2, 3.4, oc);
  const sunCloud = transmittance((cloudBase + cloudTop) / 2, sunDir, haze).map(v => v * ATM.SUN);
  const night = 1 - smooth(-14, -4, elev);
  // Bagliore della città (Milano): più forte con cielo coperto o nebbia, che lo riflettono
  // V7: il bagliore urbano dipende dall'accensione dei lampioni, non dalla notte astronomica.
  // Prima compariva solo sotto −14°: tra −5° e −10° il cielo era più buio della notte piena.
  const cityK = (1 - smooth(-8, -1, elev)) * (0.45 + 0.9 * oc + 0.8 * w.fog);
  const city = [0.0100, 0.0078, 0.0060].map(v => v * cityK);
  const sunHoriz = Math.max(sunDir[1], 0);
  // La città illumina la base delle nubi con qualunque copertura (grigio-arancio di notte)
  // L'illuminazione pubblica si accende verso il tramonto: la luce sulle nubi cresce già nel crepuscolo
  const cityOn = 1 - smooth(-11, -3, elev);
  const cityCloud = [0.052, 0.040, 0.029].map(v => v * cityOn * (1 + 0.5 * w.fog));
  const groundAmb = [0, 1, 2].map(k => sunCloud[k] * sunHoriz * 0.05 + cityCloud[k]);
  // Esposizione automatica, come una fotocamera: aperta di notte, chiusa di giorno
  // Esposizione da tabella calibrata: la luminosità dell'immagine scende in modo continuo
  // dal giorno alla notte (vedi EV_CLEAR / EV_OVERCAST). Correzioni extra per nebbia e nubi più scure.
  // V7.2: Luna (posizione, fase) e sua luce sul cielo e sulle nubi
  const moon = moonState(date, sunDir);
  const daylight = smooth(-7, 14, elev);
  const moonUp = moon.alt > -1.5;
  const moonT = moonUp ? transmittance(0.2, moon.dir, haze) : [0, 0, 0];
  const moonRad = mix(1.8, 0.09, daylight);
  const moonLight = moonUp ? moon.frac * moon.frac * smooth(-1, 15, moon.alt) * (1 - daylight) : 0;
  const evMix = Math.max(oc, smooth(0.08, 0.9, w.cover));   // V7: anche le nubi sparse riflettono la luce urbana
  const ev = mix(interpTable(EV_CLEAR, elev), interpTable(EV_OVERCAST, elev), evMix)
    - 0.4 * w.fog * (1 - night) - 1.1 * Math.max(0, w.dark - 0.25 * oc);
  return {
    elev, morning: s.az < 0, az: s.az, sunDir, haze, sunGround, sunCloud, cloudBase, cloudTop,
    night, city, groundAmb,
    nightSky: [0.0036, 0.0052, 0.0104].map((v, k) => v * night + [0.005, 0.009, 0.018][k] * moonLight),
    moon, moonCol: moonT.map(v => v * moonRad), moonLight,
    moonCloud: [0.045, 0.048, 0.055].map(v => v * moonLight),
    groundCol: [0.012, 0.012, 0.014].map(v => v * (0.2 + 0.8 * smooth(-6, 10, elev)) * 20),
    exposure: Math.pow(2, ev),
    stars: night * (1 - smooth(0.7, 1, w.cover) * 0.95) * (1 - w.fog * 0.9) * (1 - w.rain * 0.8) * (1 - w.snow * 0.8) * 0.5,
    hazeDist: 45 / (1 + (haze - 1) * 0.5),
    cirrus: (w.cloudHigh != null ? 0.45 * w.cloudHigh : 0.2 * smooth(0.02, 0.4, w.cover)) * (1 - smooth(0.7, 1, w.cover)) * (1 - w.fog),
    fog: w.fog,
    rainVeil: w.rain * 0.35 + w.snow * 0.3,
    daylight
  };
}

function phaseLabel(v) {
  let label;
  if (v.elev < -12) label = 'Notte';
  else if (v.elev < -0.833) label = v.morning ? 'Aurora' : 'Crepuscolo';
  else if (v.elev < 8) label = v.morning ? 'Sole basso, mattino' : 'Sole basso, sera';
  else label = 'Giorno';
  return `${label}, sole a ${Math.round(v.elev)}°`;
}

/*
  La copertura meteo (frazione di cielo coperto vista da terra) non coincide con la
  frazione di volume nuvoloso: guardando di sbieco lo strato si vedono più nubi.
  Tabella misurata sul rendering: copertura visibile → soglia dello shader.
*/
// V7: ricalibrata sulla nuova forma dei cumuli (copertura visibile ≈ copertura meteo).
const COVER_CURVE = [[0, 0], [0.02, 0.24], [0.05, 0.27], [0.1, 0.297], [0.2, 0.33], [0.3, 0.357], [0.4, 0.383],
  [0.5, 0.414], [0.6, 0.443], [0.7, 0.48], [0.8, 0.53], [0.9, 0.6], [0.95, 0.7], [1, 1]];
function coverToShader(c) {
  for (let i = 0; i < COVER_CURVE.length - 1; i++) {
    const [x0, y0] = COVER_CURVE[i], [x1, y1] = COVER_CURVE[i + 1];
    if (c <= x1) return mix(y0, y1, (c - x0) / (x1 - x0));
  }
  return 1;
}

function secondsOfDay(d) {
  return (d.getTime() - new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()) / 1000;
}

/** Vento delle nubi (km/s, verso cui soffia) all'istante dato: orario reale se disponibile, altrimenti quello del tempo scelto. */
function cloudWindAt(date) {
  if (wxMode === 'reale' && real.status === 'ok') {
    const up = upperWindAt(date);
    if (up) return windVectorKmS({ cloudWind: up.speed, cloudWindDir: up.dir });
  }
  return windVectorKmS(activeWeather(date));
}

/*
  V8.1 — Posizione delle nubi in funzione dell'ora: integrale del vento dalla mezzanotte, a passi
  di 15 minuti (con il vento orario reale cambia velocità e direzione durante la giornata).
  Così il cielo è coerente nel tempo: ora reale = moto naturale; cursore dell'ora = nubi dove
  sarebbero a quell'ora; riaccensione dello schermo = nessun salto all'indietro.
*/
const cloudPath = { key: '', cum: [] };
function cloudOffsetAt(date) {
  const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const seed = date.getFullYear() * 372 + date.getMonth() * 31 + date.getDate();
  const key = `${day.getTime()} ${wxMode} ${real.fetchedAt} ${real.status}`;
  const STEP = 900;   // s
  if (cloudPath.key !== key) {
    cloudPath.key = key;
    const cum = [[hashInt(seed, 1, 1, 2) * 200, hashInt(seed, 2, 2, 3) * 200]];
    for (let i = 0; i < 96; i++) {
      const v = cloudWindAt(new Date(day.getTime() + (i + 0.5) * STEP * 1000));
      const p = cum[i];
      cum.push([p[0] + v[0] * STEP, p[1] + v[1] * STEP]);
    }
    cloudPath.cum = cum;
  }
  const secs = clamp(secondsOfDay(date), 0, 86399.999);
  const i = Math.floor(secs / STEP), f = secs - i * STEP;
  const v = cloudWindAt(new Date(day.getTime() + (i + 0.5) * STEP * 1000));
  const p = cloudPath.cum[i];
  return [p[0] + v[0] * f, p[1] + v[1] * f];
}

function windVectorKmS(w) {
  const toAz = (w.cloudWindDir + 180) % 360;          // verso cui soffia
  const d = dirFromAzEl(toAz, 0);
  // V7.3: stessa velocità anche con "Rimuovi animazioni"/risparmio energetico (che su molti telefoni
  // attiva prefers-reduced-motion): con il vento reale debole le nubi risultavano immobili.
  const speed = Math.max(w.cloudWind, CONFIG.minCloudWindKmh) / 3600 * CONFIG.windTimeScale * speedMul;
  return [d[0] * speed, d[2] * speed];
}

/* =========================================================================
   PASSATE DI RENDERING
   ========================================================================= */
function renderSkyLut() {
  gl.useProgram(progSky.p);
  setU(progSky, 'uSunDir', view.sunDir);
  setU(progSky, 'uHaze', view.haze);
  setU(progSky, 'uSunIllum', ATM.SUN);
  setU(progSky, 'uMsK', 0.035);
  draw(skyLut);
}

function margins() { return [CONFIG.parallaxPx / W, CONFIG.parallaxPx / H]; }

function camSnapshot(c) { return { fwd: c.fwd.slice(), right: c.right.slice(), up: c.up.slice(), tanX: c.tanX, tanY: c.tanY, yaw: c.yaw }; }

function setCloudUniforms(wind, c, evolve) {
  gl.useProgram(progClouds.p);
  bindTex(progClouds, 'uSkyLut', 0, skyLut.tex);
  bindTex(progClouds, 'uNoise', 1, noiseTex, true);
  setU(progClouds, 'uSunDir', view.sunDir);
  setU(progClouds, 'uHaze', view.haze);
  setU(progClouds, 'uFwd', c.fwd);
  setU(progClouds, 'uRight', c.right);
  setU(progClouds, 'uUp', c.up);
  setU(progClouds, 'uTan', [c.tanX, c.tanY]);
  setU(progClouds, 'uMargin', margins());
  setU(progClouds, 'uSunColor', view.sunCloud);
  setU(progClouds, 'uGroundAmb', view.groundAmb);
  setU(progClouds, 'uNightAmb', view.nightSky.map(v => v * 1.5));
  setU(progClouds, 'uSunUp', smooth(-2, 5, view.elev));
  setU(progClouds, 'uTwi', 1 - smooth(-4, 0, view.elev));
  // La nube volumetrica bassa non deve assorbire anche cirri e nubi medie.
  const lowCover = weather.cloudLow == null ? weather.cover : weather.cloudLow;
  setU(progClouds, 'uCover', coverToShader(clamp(lowCover, 0, 1)));
  setU(progClouds, 'uDark', weather.dark);
  setU(progClouds, 'uBase', view.cloudBase);
  setU(progClouds, 'uTop', view.cloudTop);
  setU(progClouds, 'uCirrus', view.cirrus);
  setU(progClouds, 'uHazeDist', view.hazeDist);
  setU(progClouds, 'uWind', wind);
  setU(progClouds, 'uEvolve', evolve);
  setU(progClouds, 'uMoonDir', view.moon.dir);
  setU(progClouds, 'uMoonLight', view.moonCloud);
  setU(progClouds, 'uDesat', smooth(0.6, 1, weather.cover) * smooth(2, 10, view.elev) * 0.6);
}

/** Ricalcolo immediato e completo (dopo un'azione dell'utente). Annulla un ricalcolo a strisce in corso. */
function renderCloudsNow(now) {
  setCloudUniforms(windOffset, cam, evolveOffset);
  draw(clouds.front);
  clouds.frontWind = windOffset.slice();
  clouds.frontCam = camSnapshot(cam);
  clouds.job = null;
  clouds.lastStart = now;
}

function startCloudJob(now) {
  clouds.job = { wind: windOffset.slice(), evolve: evolveOffset, cam: camSnapshot(cam), strip: 0 };
  clouds.lastStart = now;
}

/** Calcola una striscia del buffer di riserva; all'ultima scambia i buffer. */
function stepCloudJob() {
  const j = clouds.job;
  if (!j) return;
  const t = clouds.back, K = CONFIG.cloudStrips;
  const y0 = Math.floor(t.h * j.strip / K), y1 = Math.floor(t.h * (j.strip + 1) / K);
  setCloudUniforms(j.wind, j.cam, j.evolve);
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(0, y0, t.w, y1 - y0);
  draw(t);
  gl.disable(gl.SCISSOR_TEST);
  if (++j.strip >= K) {
    diag.swaps++;
    [clouds.front, clouds.back] = [clouds.back, clouds.front];
    clouds.frontWind = j.wind;
    clouds.frontCam = j.cam;
    clouds.job = null;
  }
}

function renderComposite(now, ox, oy) {
  const fc = clouds.frontCam;
  gl.useProgram(progComp.p);
  bindTex(progComp, 'uSkyLut', 0, skyLut.tex);
  bindTex(progComp, 'uClouds', 1, clouds.front.tex);
  bindTex(progComp, 'uCloudDepth', 2, clouds.front.depthTex);
  setU(progComp, 'uWindDelta', [windOffset[0] - clouds.frontWind[0], windOffset[1] - clouds.frontWind[1]]);
  setU(progComp, 'uCFwd', fc.fwd);
  setU(progComp, 'uCRight', fc.right);
  setU(progComp, 'uCUp', fc.up);
  setU(progComp, 'uCTan', [fc.tanX, fc.tanY]);
  setU(progComp, 'uSunDir', view.sunDir);
  setU(progComp, 'uHaze', view.haze);
  setU(progComp, 'uFwd', cam.fwd);
  setU(progComp, 'uRight', cam.right);
  setU(progComp, 'uUp', cam.up);
  setU(progComp, 'uTan', [cam.tanX, cam.tanY]);
  setU(progComp, 'uOffset', [ox / W, -oy / H]);
  setU(progComp, 'uMargin', margins());
  setU(progComp, 'uSunDisk', view.sunGround);
  setU(progComp, 'uExposure', view.exposure);
  setU(progComp, 'uStars', view.stars);
  setU(progComp, 'uTime', reducedMotion ? 0 : (now - startTime) / 1000);
  setU(progComp, 'uPixAngle', cam.pixAngle);
  setU(progComp, 'uFlash', flashIntensity(now) * 0.06);
  setU(progComp, 'uFog', view.fog);
  setU(progComp, 'uRainVeil', view.rainVeil);
  setU(progComp, 'uCity', view.city);
  setU(progComp, 'uNightSky', view.nightSky);
  setU(progComp, 'uGroundCol', view.groundCol);
  setU(progComp, 'uOvercast', smooth(0.6, 1, weather.cover));
  setU(progComp, 'uDark', weather.dark);
  setU(progComp, 'uDebugClouds', appParams.get('debugClouds') === '1' ? 1 : 0);
  setU(progComp, 'uGroundAmb', view.groundAmb);
  setU(progComp, 'uSunColor', view.sunCloud);
  // V7.2: rotazione del cielo calcolata a ogni frame (moto continuo delle stelle)
  const eqm = eqMatrix(currentDate());
  if (progComp.loc.uEqToWorld != null) gl.uniformMatrix3fv(progComp.loc.uEqToWorld, false, eqm);
  const bl = progComp.loc['uBright[0]'];
  if (bl != null) gl.uniform4fv(bl, BRIGHT_FLAT);
  setU(progComp, 'uBrightN', BRIGHT_EQ.length);
  setU(progComp, 'uMoonDir', view.moon.dir);
  setU(progComp, 'uMoonUp', view.moon.up);
  setU(progComp, 'uMoonCol', view.moonCol);
  setU(progComp, 'uMoonR', 0.00454 * CONFIG.moonScale);
  setU(progComp, 'uMoonFrac', view.moon.frac);
  draw(null);
}

/* =========================================================================
   PRECIPITAZIONI E FULMINI (canvas 2D sovrapposto)
   ========================================================================= */
const precip = { drops: [], flakes: [], slant: 0, rainCol: [205, 215, 230], snowCol: [255, 255, 255], alpha: 1 };

function windRightComponent(w) {
  const toAz = (w.windDir + 180) % 360;
  return Math.cos((toAz - (cam ? cam.yaw + 90 : 270)) * DEG);
}

function syncParticles(v, w) {
  const nR = Math.round(CONFIG.maxRainDrops * w.rain);
  const nS = Math.round(CONFIG.maxSnowFlakes * w.snow);
  const R = Math.random;
  while (precip.drops.length < nR) {
    const z = R();
    precip.drops.push({ x: R() * (W + 200) - 100, y: R() * H, z, speed: mix(700, 1500, z), len: mix(8, 22, z) * (0.6 + w.rain * 0.6) });
  }
  precip.drops.length = nR;
  while (precip.flakes.length < nS) {
    const z = R();
    precip.flakes.push({ x: R() * (W + 100) - 50, y: R() * H, z, r: mix(0.8, 2.6, z), speed: mix(25, 90, z),
      sway: mix(6, 18, z), f: 0.7 + R() * 0.8, p: R() * Math.PI * 2 });
  }
  precip.flakes.length = nS;
  precip.slant = clamp(windRightComponent(w) * w.wind / 60, -0.45, 0.45);
  precip.rainCol = blend([120, 130, 150], [205, 215, 230], v.daylight);
  precip.snowCol = blend([170, 176, 190], [255, 255, 255], v.daylight);
  precip.alpha = mix(0.7, 1, v.daylight);
}

function drawPrecip(dt, now) {
  const { slant } = precip;
  if (precip.drops.length) {
    fx.lineCap = 'round';
    for (const near of [false, true]) {
      fx.beginPath();
      for (const d of precip.drops) {
        if ((d.z >= 0.5) !== near) continue;
        if (dt) {
          d.y += d.speed * dt;
          d.x += d.speed * slant * dt;
          if (d.y - d.len > H) { d.y = -Math.random() * 60; d.x = Math.random() * (W + 200) - 100; }
          if (d.x < -100) d.x += W + 200; else if (d.x > W + 100) d.x -= W + 200;
        }
        fx.moveTo(d.x, d.y);
        fx.lineTo(d.x - slant * d.len, d.y - d.len);
      }
      fx.strokeStyle = rgba(precip.rainCol, (near ? 0.42 : 0.22) * precip.alpha);
      fx.lineWidth = near ? 1.3 : 0.8;
      fx.stroke();
    }
  }
  if (precip.flakes.length) {
    for (const near of [false, true]) {
      fx.beginPath();
      for (const f of precip.flakes) {
        if ((f.z >= 0.5) !== near) continue;
        if (dt) {
          f.y += f.speed * dt;
          f.x += (f.speed * slant * 1.6 + Math.cos(now * 0.0013 * f.f + f.p) * f.sway) * dt;
          if (f.y - f.r > H) { f.y = -Math.random() * 30; f.x = Math.random() * (W + 100) - 50; }
          if (f.x < -50) f.x += W + 100; else if (f.x > W + 50) f.x -= W + 100;
        }
        fx.moveTo(f.x + f.r, f.y);
        fx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      }
      fx.fillStyle = rgba(precip.snowCol, (near ? 0.9 : 0.55) * precip.alpha);
      fx.fill();
    }
  }
}

/* Fulmini: al massimo 2 lampi per scarica e almeno 5 s tra le scariche (sotto la soglia WCAG). */
const storm = { next: 0, strikeAt: -1e9, bolt: null };

function makeBolt() {
  const R = Math.random;
  const main = [];
  let x = W * (0.15 + R() * 0.7), y = horizonY * (0.08 + R() * 0.15);
  main.push([x, y]);
  while (y < horizonY) {
    y += 8 + R() * 18;
    x += (R() - 0.5) * 28;
    main.push([x, Math.min(y, horizonY)]);
  }
  const branches = [];
  const nb = 1 + Math.floor(R() * 3);
  for (let b = 0; b < nb; b++) {
    const start = main[Math.floor(R() * main.length * 0.7)];
    let bx = start[0], by = start[1];
    const dir = R() < 0.5 ? -1 : 1;
    const pts = [[bx, by]];
    const steps = 3 + Math.floor(R() * 5);
    for (let s = 0; s < steps; s++) { by += 6 + R() * 14; bx += dir * (4 + R() * 14); pts.push([bx, by]); }
    branches.push(pts);
  }
  return { main, branches };
}

function updateStorm(now) {
  if (!weather.thunder || reducedMotion) { storm.next = 0; return; }
  if (!storm.next) storm.next = now + 2500 + Math.random() * 6000;
  if (now >= storm.next) {
    storm.strikeAt = now;
    storm.bolt = Math.random() < 0.55 ? makeBolt() : null;
    storm.next = now + 5000 + Math.random() * 12000;
  }
}

function flashIntensity(now) {
  if (!weather.thunder || reducedMotion) return 0;
  const t = now - storm.strikeAt;
  if (t < 0 || t > 900) return 0;
  return Math.exp(-t / 110) + (t > 160 ? 0.7 * Math.exp(-(t - 160) / 140) : 0);
}

function drawBolt(now, ox, oy) {
  const t = now - storm.strikeAt;
  if (!storm.bolt || t < 0 || t >= 260) return;
  const a = 1 - t / 260;
  const path = pts => { fx.beginPath(); pts.forEach(([x, y], i) => i ? fx.lineTo(x + ox, y + oy) : fx.moveTo(x + ox, y + oy)); };
  fx.save();
  fx.lineJoin = 'round';
  fx.shadowColor = rgba([170, 190, 255], a);
  fx.shadowBlur = 14;
  fx.strokeStyle = rgba([238, 242, 255], a);
  fx.lineWidth = 2;
  path(storm.bolt.main); fx.stroke();
  fx.lineWidth = 1;
  for (const b of storm.bolt.branches) { path(b); fx.stroke(); }
  fx.restore();
}

/* =========================================================================
   DIMENSIONI
   ========================================================================= */
function resize() {
  const rect = glCanvas.getBoundingClientRect();
  W = Math.max(1, rect.width);
  H = Math.max(1, rect.height);
  dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
  glCanvas.width = Math.round(W * dpr);
  glCanvas.height = Math.round(H * dpr);
  fxCanvas.width = Math.round(W * dpr);
  fxCanvas.height = Math.round(H * dpr);
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);

  horizonY = H;

  if (glOk) {
    const m = margins();
    const cw = Math.max(64, Math.round(glCanvas.width * (1 + 2 * m[0]) * CONFIG.cloudScale));
    const ch = Math.max(64, Math.round(glCanvas.height * (1 + 2 * m[1]) * CONFIG.cloudScale));
    freeTarget(clouds.front);
    freeTarget(clouds.back);
    clouds.front = makeCloudTarget(cw, ch);
    clouds.back = makeCloudTarget(cw, ch);
    clouds.job = null;
    cloudsDirty = true;
  }
  // Le particelle NON vengono rigenerate: su telefono il ridimensionamento scatta anche
  // quando compare o sparisce la barra del browser, e la neve "salterebbe". Quelle fuori
  // dai nuovi bordi rientrano da sole al giro successivo.
  renderKey = '';
  requestRender();
}

/* =========================================================================
   CICLO DI AGGIORNAMENTO
   ========================================================================= */
function dayKeyOf(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function currentDate() {
  if (benchmarkMode) { const fixed = new Date(benchmarkDate); if (!Number.isNaN(fixed.getTime())) return fixed; }
  const now = new Date();
  if (manual === null) return now;
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), Math.floor(manual / 60), manual % 60);
}

function updateWxStatus(date = currentDate()) {
  let text;
  if (wxMode !== 'reale') text = 'Simulazione';
  else if (real.status === 'loading' && !real.current) text = 'Carico il meteo…';
  else if (real.status === 'ok' || real.current) {
    const w = weather;
    const prefix = manual === null ? '' : `Previsione ${pad(date.getHours())}:00: `;
    text = `${prefix}${w.desc || ''}` + (w.temp != null ? ` · ${Math.round(w.temp)} °C` : '')
         + (w.wind != null ? ` · vento ${Math.round(w.wind)} km/h` : '');
  } else text = 'Meteo reale non raggiungibile: nuvole casuali';
  if (wxStatusEl.textContent !== text) wxStatusEl.textContent = text;
}

/*
  Due livelli di cambiamento:
  - stato (meteo, ora scelta con lo slider, dimensioni): ricalcolo immediato di tutto;
  - tempo che scorre in ora reale (ogni 15 s): cielo aggiornato subito, nubi ricalcolate a
    strisce in sottofondo, senza frame pesanti.
  La camera invece si aggiorna a ogni frame, così la rotazione verso il sole è continua.
*/
function update(now) {
  const date = currentDate();
  const dKey = dayKeyOf(date);
  if (dKey !== dayKey) {
    dayKey = dKey;
    const seed = date.getFullYear() * 372 + date.getMonth() * 31 + date.getDate();
    seedCover = 0.1 + hashInt(seed, 3, 7, 1) * 0.5;
    // Nuvole diverse ogni giorno; solo al primo avvio, così a mezzanotte il cielo non salta
    const t = computeSunTimes(date);
    sunTimesEl.textContent = `Alba ${t.rise === null ? '--:--' : fmtMinutes(t.rise)} · Tramonto ${t.set === null ? '--:--' : fmtMinutes(t.set)}`;
    renderKey = '';
  }
  if (!benchmarkMode) maybeFetchWeather();

  const s = solarPosition(date);
  cam = computeCamera(s.az, s.alt);

  const w = activeWeather(date);
  const wxKey = [w.cover, w.rain, w.snow, w.fog, w.dark, w.thunder, w.wind, w.windDir].map(String).join(',');
  const stateKey = `${dKey} ${W}x${H} ${horizonY} ${wxMode} ${wxKey} ${manual === null ? 'live' : 'm' + manual}`;
  const tKey = manual === null ? `${date.getHours()}:${date.getMinutes()}:${Math.floor(date.getSeconds() / 15)}` : 'manual';
  const stateChanged = stateKey !== renderKey;
  if (stateChanged || tKey !== timeKey) {
    renderKey = stateKey;
    timeKey = tKey;
    weather = w;
    view = viewFor(date, w);
    windVel = freezeMotion ? [0, 0] : windVectorKmS(w);
    if (glOk) renderSkyLut();
    if (stateChanged) {
      cloudsDirty = true;
      syncParticles(view, w);
    } else if (!clouds.job) {
      startCloudJob(now);
    }
    const mins = manual === null ? date.getHours() * 60 + date.getMinutes() : manual;
    clockEl.textContent = fmtMinutes(mins);
    if (manual === null) slider.value = mins;
    const phase = phaseLabel(view);
    const moonTxt = view.moon.alt > 0 ? ` · ${moonPhaseName(view.moon)} ${Math.round(view.moon.frac * 100)}%` : '';
    phaseEl.textContent = (manual === null ? 'Ora reale · ' : 'Anteprima · ') + phase + moonTxt;
    glCanvas.setAttribute('aria-label', `Cielo alle ${fmtMinutes(mins)}: ${phase}${w.desc ? ', ' + w.desc.toLowerCase() : ''}`);
  }
  updateWxStatus(date);

  const k = 0.18;
  tilt.x += ((tilt.on ? tilt.tx : 0) - tilt.x) * k;
  tilt.y += ((tilt.on ? tilt.ty : 0) - tilt.y) * k;
  if (!tilt.on && Math.abs(tilt.x) < 0.001 && Math.abs(tilt.y) < 0.001) tilt.x = tilt.y = 0;
}

function parallax() { return [-tilt.x * CONFIG.parallaxPx, -tilt.y * CONFIG.parallaxPx]; }

/* ----- V7.2: diagnostica a schermo (attiva con "Diagnostica nuvole" nell'app, ?debugClouds=1) ----- */
const diag = { on: appParams.get('debugClouds') === '1' || storage.get('cielo.diag') === '1',
  el: null, frames: 0, timerFrames: 0, swaps: 0, since: 0, lastFrame: 0, hist: [] };
// Aggiornata da un timer indipendente: se il ciclo di disegno si blocca, la diagnostica lo mostra
setInterval(() => updateDiag(performance.now()), 1000);
function updateDiag(now) {
  if (!diag.on) { if (diag.el) { diag.el.remove(); diag.el = null; } return; }
  if (!diag.el) {
    diag.el = document.createElement('div');
    diag.el.style.cssText = 'position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9;'
      + 'font:11px/1.35 monospace;color:#fff;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:6px;pointer-events:none;white-space:pre-wrap;max-width:calc(100vw - 170px)';
    document.body.appendChild(diag.el);
    diag.el.textContent = 'V8 · diagnostica in avvio…';
    diag.since = now;
    return;
  }
  const secs = (now - diag.since) / 1000;
  const kmh = Math.hypot(windVel[0], windVel[1]) * 3600;
  diag.hist.push([now, windOffset[0], windOffset[1], evolveOffset]);
  while (diag.hist.length > 11) diag.hist.shift();
  const h0 = diag.hist[0];
  const moved = Math.hypot(windOffset[0] - h0[1], windOffset[1] - h0[2]) * 1000;
  const evo = (evolveOffset - h0[3]) * 1000;
  const span = ((now - h0[0]) / 1000).toFixed(0);
  const stall = diag.lastFrame ? ((now - diag.lastFrame) / 1000).toFixed(1) : '—';
  diag.el.textContent = `V8.1 · fps ${(diag.frames / secs).toFixed(1)} (timer ${diag.timerFrames}) · ultimo frame ${stall} s fa\n`
    + `hidden ${document.hidden} · reduce ${prefersReduced}\n`
    + `nubi ${kmh.toFixed(0)} km/h eff. · vento quota ${Math.round(weather.cloudWind || 0)} km/h\n`
    + `offset ${windOffset[0].toFixed(2)}, ${windOffset[1].toFixed(2)} km\n`
    + `nubi spostate ${moved.toFixed(0)} m e trasformate ${evo.toFixed(0)} m negli ultimi ${span} s\n`
    + `ricalcoli nubi/s ${(diag.swaps / secs).toFixed(1)}\n`
    + `meteo ${wxMode} · ${real.status}`;
  diag.frames = 0; diag.timerFrames = 0; diag.swaps = 0; diag.since = now;
}

/** Frame WebGL: vento, nubi (immediate o a strisce), composizione. */
let wallpaperFirstFrame = false;
function glFrame(now, dtWind) {
  // V7.2: il vento usa il tempo reale trascorso, senza il limite di 0,25 s. Se Android rallenta
  // i frame del wallpaper (risparmio energetico, pagina considerata in secondo piano), prima le
  // nubi rallentavano nella stessa proporzione e sembravano ferme; ora restano dove devono essere.
  // V8.1: la posizione delle nubi è funzione dell'ora mostrata (vedi cloudOffsetAt):
  // in ora reale scorrono col vento vero; spostando il cursore dell'ora si spostano di conseguenza.
  const cd = currentDate();
  windOffset = cloudOffsetAt(cd);
  evolveOffset = CONFIG.cloudEvolveKmS * secondsOfDay(cd);
  if (!glOk) return;
  if (cloudsDirty || !clouds.frontCam) {
    renderCloudsNow(now);
    cloudsDirty = false;
  } else {
    const moving = windVel[0] !== 0 || windVel[1] !== 0;
    const camTurned = Math.abs(wrapDeg(cam.yaw - clouds.frontCam.yaw)) > 1.5;
    if (!clouds.job && (camTurned || (moving && now - clouds.lastStart > CONFIG.cloudRefreshMs))) startCloudJob(now);
    stepCloudJob();
  }
  if (weather.thunder) updateStorm(now);
  const [ox, oy] = parallax();
  renderComposite(now, ox, oy);
  if (wallpaperMode && !wallpaperFirstFrame) {
    wallpaperFirstFrame = true;
    requestAnimationFrame(() => { document.documentElement.classList.add('sky-ready'); });
  }
}

/** Overlay 2D: neve, pioggia e fulmine, disegnati a ogni aggiornamento dello schermo. */
function overlayFrame(now, dt) {
  fx.clearRect(0, 0, W, H);
  if (weather.thunder) { const [ox, oy] = parallax(); drawBolt(now, ox, oy); }
  drawPrecip(dt, now);
}

function precipActive() { return precip.drops.length > 0 || precip.flakes.length > 0 || weather.thunder; }

function needsAnimation() {
  if (tilt.on || tilt.x !== 0 || tilt.y !== 0 || dragging || clouds.job) return true;
  if (freezeMotion) return false;
  if (weather.cover > 0.01) return true;              // le nubi si muovono anche con "Rimuovi animazioni"
  if (reducedMotion) return false;
  return precipActive() || (view && view.stars > 0.0005);
}

/*
  Due cadenze indipendenti:
  - WebGL a 20 fps (30 con movimento, trascinamento o temporale): il cielo cambia lentamente;
  - neve e pioggia a ogni refresh dello schermo, con il tempo reale trascorso: moto continuo.
  La tolleranza di 4 ms evita che, per le piccole variazioni dei tempi del browser,
  un frame venga saltato e la cadenza oscilli tra 33 e 50 ms (era una causa di scatti).
*/
function loop(now) {
  rafId = 0;
  const glInterval = (tilt.on || dragging || weather.thunder) ? 33 : 50;
  const glDue = forceFrame || now - lastGl >= glInterval - 4;
  if (glDue) {
    const dtWind = freezeMotion ? 0 : Math.min(600, lastGl ? (now - lastGl) / 1000 : 0);
    if (lastGl) diag.frames++;
    forceFrame = false;
    lastGl = now;
    update(now);
    glFrame(now, dtWind);
    diag.lastFrame = now;
  }
  if (glDue || precipActive()) {
    const dt = reducedMotion ? 0 : Math.min(0.25, lastOverlay ? (now - lastOverlay) / 1000 : 0);
    lastOverlay = now;
    overlayFrame(now, dt);
  }
  schedule();
}

function schedule() {
  cancelAnimationFrame(rafId); rafId = 0;
  clearTimeout(timerId); timerId = 0;
  if (needsAnimation()) {
    rafId = requestAnimationFrame(loop);
    // V7.2: rete di sicurezza. Alcune WebView (wallpaper su display virtuale, risparmio energetico)
    // sospendono requestAnimationFrame pur mostrando la pagina: allora il ciclo prosegue col timer.
    timerId = setTimeout(() => {
      timerId = 0;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; diag.timerFrames++; loop(performance.now()); }
    }, 250);
  } else {
    // Cielo fermo: nessun frame fino al prossimo scatto di 15 secondi
    const ms = 15000 - (Date.now() % 15000) + 50;
    timerId = setTimeout(() => { rafId = requestAnimationFrame(loop); }, ms);
  }
}

function requestRender() {
  forceFrame = true;
  cancelAnimationFrame(rafId);
  clearTimeout(timerId); timerId = 0;
  rafId = requestAnimationFrame(loop);
  // Rete di sicurezza anche per il primo frame (vedi schedule)
  timerId = setTimeout(() => {
    timerId = 0;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; diag.timerFrames++; loop(performance.now()); }
  }, 250);
}

/* =========================================================================
   CONTROLLI
   ========================================================================= */
function setLive(isLive) { liveBtn.setAttribute('aria-pressed', String(isLive)); }

slider.addEventListener('input', () => { manual = +slider.value; setLive(false); requestRender(); });
liveBtn.addEventListener('click', () => { manual = null; setLive(true); requestRender(); });
toggleBtn.addEventListener('click', () => {
  panel.classList.toggle('hidden');
  toggleBtn.textContent = panel.classList.contains('hidden') ? 'Mostra controlli' : 'Nascondi controlli';
});
wxSelect.value = wxMode;
const diagBtn = document.querySelector('#diagBtn');
diagBtn.setAttribute('aria-pressed', String(diag.on));
diagBtn.addEventListener('click', () => {
  diag.on = !diag.on;
  storage.set('cielo.diag', diag.on ? '1' : '0');
  diagBtn.setAttribute('aria-pressed', String(diag.on));
  diag.frames = 0; diag.timerFrames = 0; diag.swaps = 0; diag.since = performance.now();
  requestRender();
});
wxSelect.addEventListener('change', () => {
  wxMode = wxSelect.value;
  storage.set('cielo.meteo', wxMode);
  storm.next = 0;
  renderKey = '';
  requestRender();
});

/* ----- Trascinamento orizzontale: guarda a destra e a sinistra; doppio tocco per tornare ----- */
let dragging = false, dragX = 0, downX = 0, lastTapAt = 0;
fxCanvas.addEventListener('pointerdown', e => {
  dragging = true;
  dragX = downX = e.clientX;
  fxCanvas.setPointerCapture(e.pointerId);
  requestRender();
});
fxCanvas.addEventListener('pointermove', e => {
  if (!dragging || !cam) return;
  const dx = e.clientX - dragX;
  if (dx === 0) return;
  const degPerPx = 2 * Math.atan(cam.tanX) / DEG / W;
  userYaw = clamp(userYaw - dx * degPerPx, -120, 120);
  dragX = e.clientX;
  cloudsDirty = true;            // durante il trascinamento le nubi seguono subito la vista
});
const endDrag = e => {
  if (!dragging) return;
  dragging = false;
  // Doppio tocco (anche su telefono, dove dblclick non è affidabile): torna alla vista iniziale
  if (e && e.type === 'pointerup' && Math.abs(e.clientX - downX) < 8) {
    if (e.timeStamp - lastTapAt < 320) { userYaw = 0; cloudsDirty = true; lastTapAt = 0; }
    else lastTapAt = e.timeStamp;
  }
  requestRender();
};
fxCanvas.addEventListener('pointerup', endDrag);
fxCanvas.addEventListener('pointercancel', endDrag);

/* ----- Movimento del telefono ----- */
function screenAngle() {
  let a = 0;
  if (screen.orientation && typeof screen.orientation.angle === 'number') a = screen.orientation.angle;
  else if (typeof window.orientation === 'number') a = window.orientation;
  return ((a % 360) + 360) % 360;
}
function setOrientLabel(t) { orientBtn.textContent = t; }

orientBtn.addEventListener('click', async () => {
  if (tilt.on) { tilt.on = false; setOrientLabel('Movimento: OFF'); requestRender(); return; }
  if (typeof DeviceOrientationEvent === 'undefined') { setOrientLabel('Sensore assente'); return; }
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { setOrientLabel('Permesso negato'); return; }
    }
  } catch (e) { setOrientLabel('Permesso negato'); return; }
  tilt.on = true; tilt.base = null; tilt.gotEvent = false; tilt.tx = tilt.ty = 0;
  setOrientLabel('Movimento: ON');
  requestRender();
  setTimeout(() => {
    if (tilt.on && !tilt.gotEvent) {
      tilt.on = false;
      setOrientLabel(window.isSecureContext ? 'Sensore assente' : 'Serve HTTPS');
      requestRender();
    }
  }, 1500);
});

addEventListener('deviceorientation', e => {
  if (!tilt.on || e.beta == null || e.gamma == null) return;
  tilt.gotEvent = true;
  let x, y;
  switch (screenAngle()) {
    case 90:  x = e.beta;   y = -e.gamma; break;
    case 180: x = -e.gamma; y = -e.beta;  break;
    case 270: x = -e.beta;  y = e.gamma;  break;
    default:  x = e.gamma;  y = e.beta;
  }
  if (!tilt.base) tilt.base = { x, y };
  tilt.tx = clamp((x - tilt.base.x) / 25, -1, 1);
  tilt.ty = clamp((y - tilt.base.y) / 25, -1, 1);
});
const recalibrate = () => { tilt.base = null; };
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', recalibrate);
addEventListener('orientationchange', recalibrate);

document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastGl = 0; lastOverlay = 0; requestRender(); } });

if (glOk) {
  glCanvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    showNotice('Grafica sospesa da Android: ripristino in corso…');
    // Il vecchio framebuffer non è più utilizzabile: evitare un wallpaper nero permanente.
    document.documentElement.classList.remove('sky-ready');
    cloudsDirty = true;
  });
  glCanvas.addEventListener('webglcontextrestored', () => {
    try {
      initGL();
      cloudsDirty = true;
      lastGl = 0;
      lastOverlay = 0;
      noticeEl.style.display = 'none';
      requestRender();
    } catch (err) {
      console.error('WebGL restore failed', err);
      showNotice('Ripristino grafico non riuscito: riapri lo sfondo Meteo.');
    }
  });
}

/* =========================================================================
   AVVIO
   ========================================================================= */
function start() {
  if (!glOk) {
    showNotice('Questo dispositivo non supporta WebGL2 con rendering in virgola mobile, necessario per la resa fotografica. Usa la versione V5.');
  } else {
    try {
      initGL();
    } catch (err) {
      console.error(err);
      showNotice('Errore nella preparazione della grafica: ' + err.message);
      return;
    }
  }
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(glCanvas);
  else addEventListener('resize', resize);
  resize();
}
// Non mostrare un cielo di fantasia prima che arrivi il meteo reale.
async function launchSky() {
  showNotice('Caricamento meteo reale…');
  if (wallpaperMode) {
    try {
      const cached = JSON.parse(localStorage.getItem('meteo.lastWeather') || 'null');
      if (cached && cached.lat === CONFIG.latitude && cached.lon === CONFIG.longitude &&
          cached.rec && Date.now() - cached.at < 3600000) {
        real.current = cached.rec;
        real.fetchedAt = cached.at;
        real.status = 'ok';
      }
    } catch (_) {}
    if (real.status !== 'ok') await fetchWeather();
  }
  noticeEl.style.display = 'none';
  start();
}
setTimeout(launchSky, 30);
</script>
